<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0d0d0d"/>
  <!-- Spiral arms -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#00dcaa" stroke-width="0.6" stroke-dasharray="3 2" opacity="0.5"/>
  <circle cx="16" cy="16" r="7" fill="none" stroke="#00dcaa" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.35"/>
  <circle cx="16" cy="16" r="4" fill="none" stroke="#00dcaa" stroke-width="0.5" stroke-dasharray="1.5 2" opacity="0.25"/>
  <!-- Accent dot centre -->
  <circle cx="16" cy="16" r="1.5" fill="#00dcaa"/>
  <!-- M letterform: two vertical strokes + V shape in the middle -->
  <line x1="10" y1="22" x2="10" y2="10" stroke="#00dcaa" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="22" x2="22" y2="10" stroke="#00dcaa" stroke-width="2" stroke-linecap="round"/>
  <line x1="10" y1="10" x2="16" y2="17" stroke="#00dcaa" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="10" x2="16" y2="17" stroke="#00dcaa" stroke-width="2" stroke-linecap="round"/>
</svg>
